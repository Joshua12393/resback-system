# Render Blueprint for the ResBack defense demo.
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: resback-kyeruu
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: ResBack
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

      # Supabase Postgres (Session pooler, IPv4)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require

      # Database sessions without user_id/IP columns, payload encrypted, so session
      # rows cannot be matched against feedback timestamps.
      - key: SESSION_DRIVER
        value: database_private
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync

      # Supabase Storage (S3-compatible) for profile photos
      - key: PROFILE_PHOTO_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_BUCKET
        value: resback
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_URL
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"

      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemma-4-26b-a4b-it

      # Pseudonymizes feedback submitters. Generated once; never change it.
      - key: FEEDBACK_SUBMITTER_KEY
        generateValue: true

      # First Super Admin (created once, never overwritten)
      - key: RESBACK_ADMIN_EMAIL
        sync: false
      - key: RESBACK_ADMIN_PASSWORD
        sync: false
